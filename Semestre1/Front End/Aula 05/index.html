<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do tempo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="caixa-maior">
        <input class="input-cidade" placeholder="Digite a cidade">
        <button class="botao-busca" onclick="cliqueiNoBotao()"><img class="img-busca" src="https://www.svgrepo.com/show/532555/search.svg" alt=""></button>
        <div class="caixa-media">
            <h2 class="cidade">Tempo em São Paulo</h2>
            <p class="temp">21º C</p>

            <div class="caixa-menor">
                <img src="https://openweathermap.org/img/wn/04n.png" alt="icone-info-tempo" class="img-previsao">
                <p class="texto-previsao">Nublado</p>
            </div>
            <p class="umidade">Umidade: 70%</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
