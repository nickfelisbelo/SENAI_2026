<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja com Boot Strap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<body class="bg-dark text-white">
    <nav class="navbar" style="background: linear-gradient(rgb(0, 105, 147), rgb(160, 178, 245));">

        </div>

    <header class="bg-light text-black text-center py-5 mb-4">

    </header>
    <div class="container">
        <div class="row">
             <div class="row row-cols-12 row-cols- md-4 mb-4">

                    </div>
                </div>
                
            </div>
