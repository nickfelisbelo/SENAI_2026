<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locadora SeuFilme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <header class="bg-light text-dark">
        <nav class="navbar" style="background: linear-gradient(rgb(0, 105, 147), rgb(160, 178, 245));">
            <div class="container">
                <a href="#" class="navbar-brand text-white">Locadora SeuFilme</a>
                <div class="navbar-nav">
                    <a href="#" class="nav-link active text-white">+ Novo Cliente</a>
                </div>
            </div>
        </nav>
        <div class="d-flex justify-content-center" style="padding: 20px;">
            <input type="text" class="rounded-3" id="buscarGenero" placeholder="Buscar por gênero">
            <a href="#" class="nav-link text-center rounded-4 text-white" style="width: 20%; margin-left: 10px; background: blue;">Buscar</a>

        </div>
    </header>
    <main>
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Capa</th>
                        <th>Nome</th>
                        <th>Gênero</th>
                        <th>Ano</th>
                        <th>Classificação</th>
                        <th>Produtora</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><img src="https://ingresso-a.akamaihd.net/b2b/production/uploads/article/image/4498/1eb006a35aacd8818979f5425d14b44b.jpg" alt="capa" width="150px" height="100"></td>
                        <td>Jumanji</td>
                        <td>Aventura</td>
                        <td>2018</td>
                        <td>12</td>
                        <td>Nn sei</td>
                    </tr>
                    <tr>
                        <td><img src="https://m.media-amazon.com/images/M/MV5BNTU1MzgyMDMtMzBlZS00YzczLThmYWEtMjU3YmFlOWEyMjE1XkEyXkFqcGc@._V1_.jpg" alt="capa" width="150px" height="100"></td>
                        <td>Harry Potter e a Pedra Filosofal </td>
                        <td>Fantasia</td>
                        <td>2001</td>
                        <td>10</td>
                        <td>Warner Bross</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2>Novo Filme</h2>
            <input type="text" id="capa" placeholder="Link da Imagem da Capa">
            <input type="text" id="nome" placeholder="Nome">
            <input type="text" id="genero" placeholder="Gênero">
            <input type="date" id="ano">
            <label>Classificação:</label>
            <select id="opcoes">
            <option value="">Selecione</option>
                <option value="Livre">Livre</option>
                <option value="10">10</option>
                <option value="12">12</option>
                <option value="14">14</option>
                <option value="16">16</option>
                <option value="18">18+</option>
            </select>
            <input type="text" id="produtora" placeholder="Produtora">
            <div class="modal-buttons">
                <button onclick="salvarFilme()">Salvar</button>
                <button onclick="fecharModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
