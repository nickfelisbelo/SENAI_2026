<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Pizza - Painel Administrativo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="auth-screen" class="container">
        <div class="auth-box">
            <h1>Central de Figurinhas Admin</h1>
            <p class="subtitle">Gerenciador de Figurinhas</p>

            <div class="form-group">
                <input type="email" id="auth-email" placeholder="E-mail">
                <input type="password" id="auth-senha" placeholder="Senha">
            </div>

            <div class="auth-buttons">
                <button id="btn-login" class="btn-primary">Entrar com E-mail</button>
                <button id="btn-cadastro" class="btn-secondary">Criar Conta</button>
                <div class="divider">ou</div>
                <button id="btn-google" class="btn-google">
                    <!-- <img src="https://lh3.googleusercontent.com/COxitRowZbgHe1303Yi8AJuA5hc30dIFJv2jiJa40jaAsCD2Cj1s7wC7lc797mW0Componentes" alt="" style="width:18px; margin-right:8px; display:none;"> -->
                    Entrar com o Google
                </button>
            </div>
        </div>
    </div>

    <div id="dashboard-screen" class="container wide hidden">
        <header class="main-header">
            <h2>Painel Gerenciador de Figurinhas</h2>
            <div class="user-info">
                <span id="user-display-name">Carregando...</span>
                <button id="btn-logout" class="btn-logout">Sair</button>
            </div>
        </header>

        <div class="dashboard-layout">
            <section class="admin-sidebar">
                <h3>Cadastrar Nova Figurinha</h3>
                <div class="form-group">
                    <label for="jogador-nome">Nome do Jogador</label>
                    <input type="text" id="jogador-nome" placeholder="Ex: Neymar Jr.">

                    <label for="jogador-selecao">Seleção</label>
                    <select id="jogador-selecao">
                        <option value="">Selecione uma seleção</option>

                        <option>Argentina</option>
                        <option>Brasil</option>
                        <option>Uruguai</option>
                        <option>Colômbia</option>
                        <option>Equador</option>
                        <option>Paraguai</option>
                        <option>Chile</option>
                        <option>Peru</option>
                        <option>Venezuela</option>
                        <option>Bolívia</option>

                        <option>Estados Unidos</option>
                        <option>México</option>
                        <option>Canadá</option>
                        <option>Costa Rica</option>
                        <option>Panamá</option>
                        <option>Jamaica</option>

                        <option>Inglaterra</option>
                        <option>França</option>
                        <option>Espanha</option>
                        <option>Alemanha</option>
                        <option>Itália</option>
                        <option>Portugal</option>
                        <option>Holanda</option>
                        <option>Bélgica</option>
                        <option>Croácia</option>
                        <option>Suíça</option>
                        <option>Dinamarca</option>
                        <option>Sérvia</option>
                        <option>Polônia</option>
                        <option>Ucrânia</option>
                        <option>Turquia</option>
                        <option>Áustria</option>
                        <option>Suécia</option>
                        <option>Escócia</option>

                        <option>Japão</option>
                        <option>Coreia do Sul</option>
                        <option>Irã</option>
                        <option>Arábia Saudita</option>
                        <option>Austrália</option>
                        <option>Catar</option>
                        <option>Uzbequistão</option>
                        <option>Iraque</option>

                        <option>Marrocos</option>
                        <option>Senegal</option>
                        <option>Nigéria</option>
                        <option>Camarões</option>
                        <option>Egito</option>
                        <option>Tunísia</option>
                    </select>

                    <label for="jogador-posicao">Posição</label>
                    <input type="text" id="jogador-posicao" placeholder="Ex: Atacante">

                    <label for="jogador-numero">Numero da Camisa</label>
                    <input type="number" id="jogador-numero" placeholder="Ex: 10" step="0.01">

                    <label for="jogador-imagem">Link da Imagem (Opcional)</label>
                    <input type="url" id="jogador-imagem" placeholder="http://...">
                </div>
                <button id="btn-cadastrar" class="btn-primary">Adicionar ao Site</button>
            </section>

            <section class="menu-view">
                <h3>Figurinhas Cadastradas</h3>
                <div class="jogador-grid" id="jogador-grid">
                </div>
            </section>
        </div>
    </div>
    
    <script type="module" src="script.js"></script>
</body>

</html>
